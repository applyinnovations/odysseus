# Test, build, and push an immutable internal image for xlab release tags.
# Release tags must match the source APP_VERSION, e.g. 1.0.2-xlab.1.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: odysseus-release-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/tags/*-xlab.*]"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
    pipelinesascode.tekton.dev/target-namespace: "tekton-buildkit"
  labels:
    app.kubernetes.io/part-of: ci
    tekton.dev/pipeline: odysseus-release
spec:
  taskRunTemplate:
    serviceAccountName: tekton-build-sa
    podTemplate:
      nodeSelector:
        storage.xlab.now/fast-local: "true"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
  taskRunSpecs:
    # The regular BuildKit image is privileged only inside this Kubernetes-
    # managed user namespace; its UID and capabilities are unprivileged on the
    # host. The platform admission policy rejects this Task without the setting.
    - pipelineTaskName: build-and-push
      podTemplate:
        hostUsers: false
  timeouts:
    pipeline: 75m0s
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: git_auth_secret
      value: "{{ git_auth_secret }}"
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
      - name: git_auth_secret
        type: string
    workspaces:
      - name: source
      - name: buildkit-state
      - name: basic-auth
      - name: docker-config
    tasks:
      - name: clone
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: git-clone
            - name: namespace
              value: tekton-pipelines
        timeout: 5m
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: depth
            value: "1"
          - name: submodules
            value: "false"

      - name: verify-release
        runAfter:
          - clone
        taskSpec:
          params:
            - name: tag
              type: string
          workspaces:
            - name: source
          steps:
            - name: version
              image: docker.io/library/python:3.14-slim@sha256:ce40764625a4ff50df3548277632e7f96c4e77fe75fa848aae9885476e7df5a4
              workingDir: $(workspaces.source.path)
              env:
                - name: RELEASE_TAG
                  value: $(params.tag)
              script: |
                #!/bin/sh
                set -eu
                version="$(sed -n 's/^APP_VERSION *= *"\([^"]*\)".*/\1/p' src/constants.py | head -n 1)"
                test -n "${version}"
                echo "${RELEASE_TAG}" | grep -Eq "^${version}-xlab\.[1-9][0-9]*$" || {
                  echo "Release tag ${RELEASE_TAG} does not match ${version}-xlab.N" >&2
                  exit 2
                }
        params:
          - name: tag
            value: $(tasks.clone.results.TAG)
        workspaces:
          - name: source
            workspace: source

      - name: test
        runAfter:
          - verify-release
        timeout: 25m
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: pytest
              image: docker.io/library/python:3.14-slim@sha256:ce40764625a4ff50df3548277632e7f96c4e77fe75fa848aae9885476e7df5a4
              workingDir: $(workspaces.source.path)
              computeResources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "8"
                  memory: 8Gi
              script: |
                #!/bin/sh
                set -eu
                apt-get update
                apt-get install -y --no-install-recommends git nodejs
                rm -rf /var/lib/apt/lists/*
                python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
                python -m pytest -q
        workspaces:
          - name: source
            workspace: source

      - name: build-and-push
        runAfter:
          - test
        timeout: 45m
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: buildkit-build-push
            - name: namespace
              value: tekton-buildkit
        params:
          - name: IMAGE
            value: registry.registry.svc.cluster.local/odysseus-xlab
          - name: COMMIT_SHA
            value: $(tasks.clone.results.COMMIT_SHA)
          - name: EXTRA_TAGS
            value: $(tasks.clone.results.TAG)
          - name: REGISTRY_INSECURE
            value: "true"
        workspaces:
          - name: source
            workspace: source
          - name: buildkit-state
            workspace: buildkit-state
          - name: docker-config
            workspace: docker-config

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: fast-local
          resources:
            requests:
              storage: 20Gi
    - name: buildkit-state
      persistentVolumeClaim:
        claimName: oci-layer-cache
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: docker-config
      secret:
        secretName: registry-credentials
